<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin - Jadwal Petugas Mushola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header>
  <img class="ic" src="icon.png" alt="" onerror="this.style.display='none'">
  <div><h1>Admin Jadwal Mushola</h1></div>
  <a class="back" href="index.html" style="margin-left:auto">&larr; Jadwal</a>
</header>

<div class="wrap">
  <div class="card">
    <div class="mh"><span id="mt">Masuk Admin</span></div>

    <div class="mb" id="stLogin">
      <label for="pinIn">PIN</label>
      <input type="password" id="pinIn" placeholder="Masukkan PIN admin" autocomplete="off">
      <div class="msg" id="loginMsg"></div>
      <button class="btn pri" id="btnLogin">Masuk</button>
    </div>

    <div class="mb" id="stAdmin" style="display:none">
      <label>Petugas (<span id="jml">0</span>) <span class="hint">- minimal 4 orang</span></label>
      <div class="chips" id="chips"></div>
      <div class="add"><input type="text" id="namaBaru" placeholder="Nama petugas baru"><button class="btn" id="btnTambah">Tambah</button></div>
      <label for="xl">Impor dari Excel <span class="hint">(kolom A = nama, baris 1 = header)</span></label>
      <input type="file" id="xl" accept=".xlsx,.xls,.csv">
      <button class="btn pri" id="btnSimpan">Simpan daftar petugas</button>
      <hr style="border:0;border-top:1px solid var(--line)">
      <label for="bulanAcak">Bulan yang diacak</label>
      <input type="month" id="bulanAcak">
      <button class="btn" id="btnLengkapi">Lengkapi tanggal kosong (tanpa mengubah yang sudah ada)</button>
      <div class="grid2">
        <button class="btn pri" id="btnAcak">Acak ulang bulan ini</button>
        <button class="btn" id="btnTes">Tes kirim ke grup dummy</button>
      </div>
      <div class="msg" id="admMsg"></div>
      <button class="btn red" id="btnKeluar">Keluar admin</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
