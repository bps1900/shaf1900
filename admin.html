<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin - Jadwal Petugas Mushola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header>
  <img class="ic" src="icon.png" alt="" onerror="this.style.display='none'">
  <div><h1>Admin Jadwal Mushola</h1></div>
  <a class="back" href="index.html" style="margin-left:auto">&larr; Jadwal</a>
</header>

<div class="wrap">

  <!-- Login PIN -->
  <div class="card login" id="stLogin">
    <div class="ttl">Masuk Admin</div>
    <label for="pinIn">PIN</label>
    <input type="password" id="pinIn" placeholder="Masukkan PIN admin" autocomplete="off">
    <div class="msg" id="loginMsg"></div>
    <button class="btn pri" id="btnLogin">Masuk</button>
  </div>

  <!-- Panel admin: 2 kolom, 1 layar -->
  <div class="adm" id="stAdmin" style="display:none">

    <section class="card pn">
      <div class="ttl">Petugas <span class="cnt">(<span id="jml">0</span>)</span> <span class="hint">minimal 4 orang · klik nama / ✎ untuk memperbaiki · tombol 🎤 = khusus imam</span></div>
      <div class="chips" id="chips"></div>
      <div class="add">
        <input type="text" id="namaBaru" placeholder="Nama petugas baru">
        <button class="btn" id="btnTambah">Tambah</button>
      </div>
      <div class="imp">
        <label for="xl">Impor Excel <span class="hint">(kolom A = nama, baris 1 = header)</span></label>
        <input type="file" id="xl" accept=".xlsx,.xls,.csv">
      </div>
      <button class="btn pri" id="btnSimpan">Simpan daftar petugas</button>
    </section>

    <section class="card ak">
      <div class="ttl">Jadwal</div>
      <label for="bulanAcak">Bulan</label>
      <input type="month" id="bulanAcak">
      <button class="btn pri" id="btnAcak">Acak ulang bulan ini (isi semua hari kerja)</button>
      <button class="btn" id="btnEdit">Edit manual jadwal bulan ini</button>
      <button class="btn" id="btnTes">Tes kirim ke grup dummy</button>
      <div class="msg" id="admMsg"></div>
      <button class="btn red push" id="btnKeluar">Keluar admin</button>
    </section>

  </div>
</div>

<!-- Editor jadwal manual -->
<div class="modal" id="mdEdit" style="display:none">
  <div class="card box">
    <div class="ttl">Edit jadwal <span class="cnt" id="mdBulan"></span></div>
    <div class="hint">Ubah nama imam / muazin lewat pilihan, lalu klik Simpan jadwal.</div>
    <div class="tblw" id="mdBody"></div>
    <div class="msg" id="mdMsg"></div>
    <div class="row">
      <button class="btn" id="mdBatal">Batal</button>
      <button class="btn pri" id="mdSimpan">Simpan jadwal</button>
    </div>
  </div>
</div>

<script src="music.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
