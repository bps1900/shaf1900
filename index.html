<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Petugas Mushola Asyakirin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f3d8f; --blue:#2a7de1; --green:#16a34a; --bg:#f4f6fb; --card:#fff;
  --line:#e3e8f2; --txt:#0f172a; --mut:#64748b; --amber:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.35}
header{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px}
header img.ic{width:40px;height:40px;border-radius:10px;flex:none}
header h1{font-size:16px;font-weight:700;line-height:1.2}
header p{font-size:12px;color:var(--mut)}
header img.logo{height:34px;margin-left:auto;flex:none}
main{padding:10px 12px 24px;width:100%}

/* banner */
.banner{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:10px}
.banner small{font-size:11px;font-weight:600;letter-spacing:.08em;opacity:.85}
.banner h2{font-size:18px;font-weight:700}
.banner p{font-size:13px;opacity:.95;margin-top:2px}

/* toolbar */
.bar{display:flex;gap:8px;margin-bottom:10px}
.nav{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.nav button{border:0;background:none;width:34px;height:38px;font-size:18px;color:var(--navy);cursor:pointer}
.nav input{border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);height:38px;padding:0 6px;font:inherit;font-weight:500;width:150px;background:#fff}
.bar input.cari{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:0 12px;height:38px;font:inherit;background:#fff}

/* prev button */
.prev{width:100%;border:1px dashed #b8c4dc;background:#fff;color:var(--navy);border-radius:12px;padding:8px;margin-bottom:8px;font:inherit;font-weight:600;cursor:pointer}
.prev:hover{background:#eef3fd}

/* list */
#list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:92px 1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row.past{opacity:.7}
.row.first{border:2px solid var(--blue);box-shadow:0 4px 14px rgba(42,125,225,.25)}
.row.first .date{background:linear-gradient(160deg,var(--navy),var(--blue));color:#fff}
.row.first .date .hari,.row.first .date .tgl{color:#fff}
.date{background:#eef3fd;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;text-align:center}
.date .tgl{font-size:17px;font-weight:800;color:var(--navy);line-height:1.1}
.date .hari{font-size:17px;font-weight:700;color:var(--blue);margin-top:2px}
.date .tag{margin-top:4px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 8px}
.slot{padding:8px 12px;border-left:1px solid var(--line);min-width:0}
.slot.empty{background:#fafbfe}
.slot .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.slot .nm{font-weight:700;font-size:15px}
.slot .jam{background:#eef3fd;color:var(--navy);font-weight:600;font-size:12px;padding:1px 9px;border-radius:99px}
.slot .p{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .p b{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.03em;text-transform:uppercase;margin-right:4px}
.kosong{text-align:center;color:var(--mut);padding:24px}

@media(max-width:640px){
  header h1{font-size:14px}header p{font-size:11px}header img.logo{height:26px}header img.ic{width:34px;height:34px}
  main{padding:8px 8px 20px}
  .banner h2{font-size:16px}.banner p{font-size:12px}
  .bar{flex-wrap:wrap}
  .nav{flex:1}.nav input{flex:1;width:auto}
  .bar input.cari{flex:1 1 100%}
  .row{grid-template-columns:62px 1fr}
  .date{grid-row:span 2;padding:6px 2px}
  .date .tgl{font-size:15px}.date .hari{font-size:15px}
  .slot{padding:6px 10px}
  .slot + .slot{border-top:1px solid var(--line)}
  .slot .p{white-space:normal}
}

/* admin */
.gear{margin-left:8px;flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:50}
.ov.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.mh button{border:0;background:#eef3fd;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:15px}
.mb{padding:14px 16px;display:grid;gap:10px}
.mb label{font-weight:600;font-size:13px}
.mb input[type=password],.mb input[type=text],.mb input[type=file]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
.btn{border:0;border-radius:10px;padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;background:#eef3fd;color:var(--navy)}
.btn.pri{background:#1f5fe0;color:#fff}
.btn.red{background:#fee2e2;color:#b91c1c}
.btn:disabled{opacity:.6}
.msg{font-size:13px;color:#b91c1c;min-height:16px}
.msg.ok{color:var(--green)}
.add{display:flex;gap:6px}
.add input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}
.chip{display:flex;align-items:center;gap:6px;background:#eef3fd;border-radius:99px;padding:3px 4px 3px 10px;font-size:13px}
.chip button{border:0;background:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;color:#b91c1c;line-height:1}
.hint{font-size:12px;color:var(--mut);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<header>
  <img class="ic" src="icon.png" alt="" onerror="this.style.display='none'">
  <div><h1>Jadwal Petugas Mushola Asyakirin</h1></div>
  <img class="logo" src="logo-bps.png" alt="BPS" onerror="this.style.display='none'">
  <button class="gear" id="gear" title="Admin" aria-label="Admin">⚙</button>
</header>

<main>
  <div class="banner" id="banner"></div>
  <div class="bar">
    <div class="nav">
      <button id="bPrev" aria-label="Bulan sebelumnya">‹</button>
      <input type="month" id="bulan">
      <button id="bNext" aria-label="Bulan berikutnya">›</button>
    </div>
    <input class="cari" id="cari" type="search" placeholder="Cari nama petugas...">
  </div>
  <div id="list"></div>
</main>


<div class="ov" id="ov">
 <div class="modal">
  <div class="mh"><span id="mt">Masuk Admin</span><button id="mx" aria-label="Tutup">✕</button></div>

  <div class="mb" id="stLogin">
    <label for="pinIn">PIN</label>
    <input type="password" id="pinIn" placeholder="Masukkan PIN admin" autocomplete="off">
    <div class="msg" id="loginMsg"></div>
    <button class="btn pri" id="btnLogin">Masuk</button>
  </div>

  <div class="mb" id="stAdmin" style="display:none">
    <label>Petugas (<span id="jml">0</span>) <span class="hint">- minimal 4 orang</span></label>
    <div class="chips" id="chips"></div>
    <div class="add"><input type="text" id="namaBaru" placeholder="Nama petugas baru"><button class="btn" id="btnTambah">Tambah</button></div>
    <label for="xl">Impor dari Excel <span class="hint">(kolom A = nama, baris 1 = header)</span></label>
    <input type="file" id="xl" accept=".xlsx,.xls,.csv">
    <button class="btn pri" id="btnSimpan">Simpan daftar petugas</button>
    <hr style="border:0;border-top:1px solid var(--line)">
    <div class="grid2">
      <button class="btn pri" id="btnAcak">Acak ulang bulan terpilih</button>
      <button class="btn" id="btnTes">Tes kirim ke grup dummy</button>
    </div>
    <div class="msg" id="admMsg"></div>
    <button class="btn red" id="btnKeluar">Keluar admin</button>
  </div>
 </div>
</div>

<script>
// >>> GANTI dengan URL Web App Apps Script Anda (yang sama dengan file lama) <<<
const API_URL = 'GANTI_DENGAN_URL_WEB_APP';

const TZ = 'Asia/Jakarta';
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const $ = id => document.getElementById(id);

const todayStr = () => new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const parse = s => new Date(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10), 12);
const indo = s => { const d = parse(s); return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let data = [], showPast = false;
const TODAY = todayStr();
$('bulan').value = TODAY.slice(0,7);

async function load(bulan){
  $('list').innerHTML = '<div class="kosong">Memuat…</div>';
  try{
    const r = await fetch(API_URL + '?bulan=' + bulan);
    data = await r.json();
  }catch(e){ data = []; $('list').innerHTML = '<div class="kosong">Gagal memuat jadwal.</div>'; return; }
  showPast = false;
  render();
}

// kelompokkan per tanggal
function group(rows){
  const m = {};
  rows.forEach(r => (m[r.tanggal] ||= []).push(r));
  return Object.keys(m).sort().map(t => ({tgl:t, items:m[t]}));
}

function slotHtml(it){
  if(!it) return '<div class="slot empty"></div>';
  return `<div class="slot">
    <div class="head"><span class="nm">${esc(it.salat)}</span><span class="jam">${esc(it.jam||'-')}</span></div>
    <div class="p"><b>Imam:</b>${esc(it.imam)}</div>
    <div class="p"><b>Muazin:</b>${esc(it.muazin)}</div>
  </div>`;
}

function rowHtml(g, cls, tag){
  const d = parse(g.tgl);
  const zu = g.items.find(i => i.salat === 'Zuhur');
  const as = g.items.find(i => i.salat === 'Ashar');
  return `<div class="row ${cls}">
    <div class="date"><div class="tgl">${d.getDate()} ${BULAN[d.getMonth()]}</div><div class="hari">${HARI[d.getDay()]}</div>${tag?`<div class="tag">${tag}</div>`:''}</div>
    ${slotHtml(zu)}${slotHtml(as)}
  </div>`;
}

async function bannerHtml(){
  // cari jadwal hari ini / berikutnya (di bulan ini, lalu bulan depan bila perlu)
  let all = group(data);
  const hariIni = all.find(g => g.tgl === TODAY);
  let next = all.find(g => g.tgl > TODAY);
  if(!hariIni && !next && $('bulan').value.slice(0,7) === TODAY.slice(0,7)){
    const d = parse(TODAY); const nb = new Date(d.getFullYear(), d.getMonth()+1, 1);
    const key = nb.getFullYear()+'-'+String(nb.getMonth()+1).padStart(2,'0');
    try{ const r = await (await fetch(API_URL+'?bulan='+key)).json(); const g = group(r)[0]; if(g) next = g; }catch(e){}
  }
  let p;
  if(hariIni) p = 'Jadwal hari ini ada di urutan paling atas.';
  else p = 'Tidak ada jadwal hari ini (akhir pekan/libur).' + (next ? ' Berikutnya: ' + indo(next.tgl) + '.' : '');
  return `<small>HARI INI</small><h2>${indo(TODAY)}</h2><p>${p}</p>`;
}

async function render(){
  const q = $('cari').value.trim().toLowerCase();
  let groups = group(data);
  if(q) groups = groups.filter(g => g.items.some(i => (i.imam+' '+i.muazin).toLowerCase().includes(q)));

  const past = groups.filter(g => g.tgl < TODAY);
  const upc = groups.filter(g => g.tgl >= TODAY);
  const hidePast = !showPast && upc.length > 0 && past.length > 0;

  let html = '';
  if(hidePast) html += `<button class="prev" id="btnPrev">⬆ Lihat jadwal sebelumnya (${past.length} hari)</button>`;
  else if(showPast && past.length) html += `<button class="prev" id="btnPrev">⬇ Sembunyikan jadwal sebelumnya</button>`;

  const shown = hidePast ? upc : groups;
  let firstDone = false;
  shown.forEach(g => {
    const isPast = g.tgl < TODAY;
    let cls = isPast ? 'past' : '', tag = '';
    if(!isPast && !firstDone){ cls = 'first'; firstDone = true; tag = g.tgl === TODAY ? 'HARI INI' : 'BERIKUTNYA'; }
    html += rowHtml(g, cls, tag);
  });
  if(!shown.length) html += '<div class="kosong">Belum ada jadwal.</div>';
  $('list').innerHTML = html;

  const b = $('btnPrev');
  if(b) b.onclick = () => { showPast = !showPast; render(); };
  $('banner').innerHTML = await bannerHtml();
}

function geser(n){
  const [y,m] = $('bulan').value.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  $('bulan').value = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  load($('bulan').value);
}
$('bPrev').onclick = () => geser(-1);
$('bNext').onclick = () => geser(1);
$('bulan').onchange = () => $('bulan').value && load($('bulan').value);
$('cari').oninput = render;


// ================= ADMIN =================
let pin='', daftar=[], dirty=false;
const ov=$('ov');
async function api(body){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({pin},body))});
  return r.json();
}
function setMsg(t,ok){const m=$('admMsg');m.textContent=t||'';m.className='msg'+(ok?' ok':'');}
function showStep(admin){
  $('stLogin').style.display=admin?'none':'grid';
  $('stAdmin').style.display=admin?'grid':'none';
  $('mt').textContent=admin?'Panel Admin':'Masuk Admin';
}
function bukaAdmin(){
  ov.classList.add('on');
  if(!pin){showStep(false);$('pinIn').value='';$('loginMsg').textContent='';setTimeout(()=>$('pinIn').focus(),50);}
}
function tutupAdmin(){ov.classList.remove('on');}
function keluarAdmin(){pin='';daftar=[];dirty=false;tutupAdmin();showStep(false);}
$('gear').onclick=bukaAdmin;
$('mx').onclick=tutupAdmin;
ov.onclick=e=>{if(e.target===ov)tutupAdmin();};
$('btnKeluar').onclick=keluarAdmin;

async function login(){
  const b=$('btnLogin'); pin=$('pinIn').value.trim();
  if(!pin){$('loginMsg').textContent='PIN wajib diisi';return;}
  b.disabled=true;b.textContent='Memeriksa…';
  try{
    const r=await api({aksi:'daftar'});
    if(r.error){pin='';$('loginMsg').textContent=r.error;}
    else{daftar=r.petugas||[];dirty=false;renderDaftar();setMsg('');showStep(true);}
  }catch(e){pin='';$('loginMsg').textContent='Gagal terhubung ke server';}
  b.disabled=false;b.textContent='Masuk';
}
$('btnLogin').onclick=login;
$('pinIn').onkeydown=e=>{if(e.key==='Enter')login();};

function renderDaftar(){
  $('jml').textContent=daftar.length;
  $('chips').innerHTML=daftar.length?daftar.map((n,i)=>`<span class="chip">${esc(n)}<button data-i="${i}" aria-label="Hapus">✕</button></span>`).join(''):'<span class="hint">Belum ada petugas</span>';
}
$('chips').onclick=e=>{
  const i=e.target.dataset&&e.target.dataset.i; if(i===undefined)return;
  daftar.splice(+i,1);dirty=true;renderDaftar();
};
function tambah(n){
  n=String(n||'').trim();
  if(n&&!daftar.some(x=>x.toLowerCase()===n.toLowerCase())){daftar.push(n);dirty=true;return true;}
  return false;
}
$('btnTambah').onclick=()=>{if(tambah($('namaBaru').value)){$('namaBaru').value='';renderDaftar();}};
$('namaBaru').onkeydown=e=>{if(e.key==='Enter')$('btnTambah').click();};

function muatXlsx(){
  return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s);});
}
$('xl').onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{
    await muatXlsx();
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
    let n=0; rows.slice(1).forEach(r=>{if(tambah(r[0]))n++;});
    renderDaftar();setMsg(n+' nama ditambahkan. Klik "Simpan daftar petugas".',true);
  }catch(err){setMsg('Gagal membaca file Excel');}
  e.target.value='';
};

async function simpan(){
  const r=await api({aksi:'petugas',data:daftar});
  if(r.error)throw new Error(r.error);
  dirty=false;return r;
}
async function jalankan(btn,label,fn){
  btn.disabled=true;const t=btn.textContent;btn.textContent=label;setMsg('');
  try{await fn();}catch(e){setMsg(e.message||'Gagal');}
  btn.disabled=false;btn.textContent=t;
}
$('btnSimpan').onclick=()=>jalankan($('btnSimpan'),'Menyimpan…',async()=>{const r=await simpan();setMsg('Tersimpan ('+r.jumlah+' petugas)',true);});
$('btnAcak').onclick=()=>{
  const b=$('bulan').value;
  if(!confirm('Acak ulang jadwal '+b+'? Hari yang sudah lewat tidak berubah.'))return;
  jalankan($('btnAcak'),'Mengacak…',async()=>{
    if(dirty)await simpan();
    const r=await api({aksi:'acak',bulan:b});
    if(r.error)throw new Error(r.error);
    setMsg('Jadwal diacak ('+r.jumlah+' slot)',true);
    await load(b);
  });
};
$('btnTes').onclick=()=>jalankan($('btnTes'),'Mengirim…',async()=>{
  const r=await api({aksi:'tes'});
  if(r.error)throw new Error(r.error);
  if(r.status===false)throw new Error('Ditolak: '+(r.reason||'gagal'));
  setMsg('Pesan tes terkirim ke grup dummy',true);
});

load($('bulan').value);
</script>
</body>
</html>
