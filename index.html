<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Petugas Mushola Asyakirin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img class="ic" src="icon.png" alt="" onerror="this.style.display='none'">
  <div><h1>Jadwal Petugas Mushola Asyakirin</h1></div>
  <a class="logo-link" href="admin.html" aria-label="BPS"><img class="logo" src="bps.png" alt="BPS" onerror="this.style.display='none'"></a>
</header>

<main>
  <div class="banner" id="banner"></div>
  <div class="bar">
    <div class="nav">
      <button id="bPrev" aria-label="Bulan sebelumnya">&lsaquo;</button>
      <input type="month" id="bulan">
      <button id="bNext" aria-label="Bulan berikutnya">&rsaquo;</button>
    </div>
    <input class="cari" id="cari" type="search" placeholder="Cari nama petugas...">
    <div class="legend"><span><i class="li"></i>Imam</span><span><i class="lm"></i>Muazin</span></div>
  </div>
  <div id="list"></div>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
